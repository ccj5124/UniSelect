name: Deploy app to GitHub Pages

# The site is the static contents of app/. Deploying via Actions rather than the
# "branch and folder" setting keeps the source layout as is, since that setting
# only allows the repository root or /docs.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requires Settings > Pages > Source: "GitHub Actions" to be set once by a
      # repo admin. The workflow's GITHUB_TOKEN cannot enable Pages itself, so
      # `enablement: true` fails here with a permissions error.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./app
      - id: deployment
        uses: actions/deploy-pages@v4
