<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniSelect</title>
<meta name="description" content="Australian university entry ranks matched to published graduate outcomes and real admission pathways.">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<header class="topbar">
  <button class="back" id="back" hidden aria-label="Back">&#8592;</button>
  <a class="brand" href="#/">UniSelect</a>
  <button class="lang" id="lang" aria-label="Switch language">EN</button>
</header>

<main id="app">

  <!-- ============================================================ HOME -->
  <section class="view" id="view-home">
    <div class="hero">
      <h1 data-i="heroTitle"></h1>
      <p class="sub" data-i="heroSub"></p>
    </div>

    <form class="card form" id="form">
      <label class="field">
        <span data-i="fATAR"></span>
        <input type="number" id="atar" min="30" max="99.95" step="0.05" inputmode="decimal" placeholder="80.00">
        <small data-i="fATARHint"></small>
      </label>

      <label class="field">
        <span data-i="fKeyword"></span>
        <input type="search" id="keyword" autocomplete="off" placeholder="Physiotherapy">
        <small data-i="fKeywordHint"></small>
      </label>

      <label class="field">
        <span data-i="fArea"></span>
        <select id="area"></select>
      </label>

      <label class="field">
        <span data-i="fState"></span>
        <select id="state"></select>
      </label>

      <label class="check">
        <input type="checkbox" id="onlyGood" checked>
        <span data-i="fOnlyGood"></span>
      </label>

      <button type="submit" class="primary" data-i="fSubmit"></button>
    </form>

    <div class="card note">
      <h2 data-i="whyTitle"></h2>
      <p data-i="whyBody"></p>
      <div class="stat-row" id="homeStats"></div>
    </div>
  </section>

  <!-- ========================================================= RESULTS -->
  <section class="view" id="view-results" hidden>
    <div class="results-head">
      <h1 id="resTitle"></h1>
      <p class="sub" id="resSub"></p>
    </div>

    <div class="sortbar" id="sortbar"></div>
    <div id="resList" class="list"></div>
    <p class="empty" id="resEmpty" hidden data-i="noResults"></p>
  </section>

  <!-- ========================================================== DETAIL -->
  <section class="view" id="view-detail" hidden>
    <div id="detail"></div>
  </section>

</main>

<footer class="foot">
  <p data-i="footSources"></p>
  <p class="fine" data-i="footDisclaimer"></p>
</footer>

<script src="app.js?v=3"></script>
</body>
</html>
